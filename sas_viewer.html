<script>
function safe(obj, path, fallback = "—") {
    try {
        const val = path.split(".").reduce((o, k) => o[k], obj);
        return val === undefined || val === null ? fallback : val;
    } catch {
        return fallback;
    }
}


/* -----------------------------------------
   Reservation status helpers
-------------------------------------------- */

function getSegmentReservationStatus(segment, data, ctx) {

    // Map modern segment.id -> legacy FS_x
    const legacyKey = ctx.legacyKeyById[String(segment.id)];

    if (!legacyKey) return null;

    const statusDetails = safe(
        data,
        "LEGACY.status.statusDetails",
        null
    );

    if (!statusDetails || typeof statusDetails !== "object") {
        return null;
    }

    // Loop passengers: P_1_ADT etc.
    for (const paxKey in statusDetails) {

        const segmentStatuses = safe(
            statusDetails,
            `${paxKey}.reservationStatus.${legacyKey}`,
            null
        );

        if (
            segmentStatuses &&
            typeof segmentStatuses === "object"
        ) {

            // HX / HK / TK etc.
            const statusCode = Object.keys(segmentStatuses)[0];

            if (statusCode) {
                return segmentStatuses[statusCode];
            }
        }
    }

    return null;
}

function getSegmentStatusName(segment, data, ctx) {
    return safe(
        getSegmentReservationStatus(segment, data, ctx),
        "name"
    );
}

function getSegmentBookingClass(segment, data, ctx) {
    return safe(
        getSegmentReservationStatus(segment, data, ctx),
        "bookingClass"
    );
}

function getSegmentFareClass(segment, data, ctx) {
    return safe(
        getSegmentReservationStatus(segment, data, ctx),
        "fareClass"
    );
}

function getSegmentServiceClass(segment, data, ctx) {
    return safe(
        getSegmentReservationStatus(segment, data, ctx),
        "serviceClass"
    );
}

function getSegmentServiceClassName(segment, data, ctx) {
    return safe(
        getSegmentReservationStatus(segment, data, ctx),
        "serviceClassName"
    );
}

function getSegmentFsNumber(segment, ctx) {

    if (!ctx || !ctx.legacyKeyById) return "N/A";

    return ctx.legacyKeyById[String(segment.id)] || "N/A";
}

/* -----------------------------------------
   Segment ancillary helpers
-------------------------------------------- */

function getPassengerByKey(data, paxKey) {

    return (data.LEGACY.passengersArray || []).find(
        p => p.uId === paxKey
    );
}

function getPassengerNameByKey(data, paxKey) {

    const pax = getPassengerByKey(data, paxKey);

    if (!pax) return paxKey;

    return `${safe(pax, "firstName")} ${safe(pax, "lastName")}`;
}


/* -----------------------------------------
   Seats for segment
-------------------------------------------- */

function getSeatsForSegment(fsNumber, data) {

    const result = [];

    (data.LEGACY.ancillaryProducts || []).forEach(product => {

        if (product.name !== "seat") return;

        (product.connections || []).forEach(conn => {

            (conn.segments || []).forEach(seg => {

                if (seg.id !== fsNumber) return;

                (seg.passengers || []).forEach(pax => {

                    result.push({
                        passengerKey: pax.id,
                        passengerName: getPassengerNameByKey(data, pax.id),
                        seat: safe(pax, "allowance.number")
                    });

                });

            });

        });

    });

    return result;
}


/* -----------------------------------------
   Baggage for segment
-------------------------------------------- */

function getBaggageForSegment(fsNumber, data) {

    const result = [];

    (data.LEGACY.ancillaryProducts || []).forEach(product => {

        if (product.name !== "baggage") return;

        (product.connections || []).forEach(conn => {

            (conn.segments || []).forEach(seg => {

                if (seg.id !== fsNumber) return;

                (seg.passengers || []).forEach(pax => {

                    const bag = safe(
                        pax,
                        "allowance.checkinBaggage",
                        null
                    );

                    if (!bag) return;

                    result.push({
                        passengerKey: pax.id,
                        passengerName: getPassengerNameByKey(data, pax.id),
                        baseAllowance: safe(bag, "baseAllowance"),
                        tierAllowance: safe(bag, "tierAllowance"),
                        total: safe(bag, "total"),
                        concept: safe(bag, "concept"),
                        maxValuePerUnit: safe(bag, "maxValuePerUnit"),
                        unitType: safe(bag, "unitType")
                    });

                });

            });

        });

    });

    return result;
}


/* -----------------------------------------
   FQTV / EuroBonus for segment
-------------------------------------------- */

function getFqtvForSegment(fsNumber, data) {

    const result = [];

    (data.LEGACY.passengersArray || []).forEach(pax => {

        const eurobonusList = safe(
            pax,
            "engagements.euroBonus",
            []
        );

        eurobonusList.forEach(eb => {

            const associatedSegments =
                safe(eb, "associatedFlightSegments", []);

            if (!associatedSegments.includes(fsNumber)) return;

            result.push({
                passengerKey: pax.uId,
                passengerName: `${safe(pax, "firstName")} ${safe(pax, "lastName")}`,
                number: safe(eb, "id"),
                tierCode: safe(eb, "airline.code"),
                tierName: safe(eb, "airline.name"),
                alliance: safe(eb, "alliance.name")
            });

        });

    });

    return result;
}

function buildTicketingContext(data) {
    const legacyKeyById = {};
    const ticketedSegments = new Set();

    // 1. Modern id -> legacy FS_x mapping from LEGACY.connectionsArray
    if (data.LEGACY?.connectionsArray) {
        data.LEGACY.connectionsArray.forEach(conn => {
            (conn.segments || []).forEach(seg => {
                if (seg.id != null && seg.segmentKey) {
                    legacyKeyById[String(seg.id)] = seg.segmentKey;
                }
            });
        });
    }

    // 2. Ticketed segments from ALL flights in LEGACY.documentInformation
    if (data.LEGACY?.documentInformation) {
        for (const paxKey in data.LEGACY.documentInformation) {
            const paxDoc = data.LEGACY.documentInformation[paxKey];
            if (!paxDoc || !Array.isArray(paxDoc.flights)) continue;

            paxDoc.flights.forEach(flight => {
                const assoc = flight?.associatedFlightSegments || [];
                assoc.forEach(segKey => {
                    if (segKey) ticketedSegments.add(segKey);
                });
            });
        }
    }

    return { legacyKeyById, ticketedSegments };
}



/* -----------------------------------------
   Determine ticketing status:
   - Ticketed if legacy FS_x is in ticketedSegments
-------------------------------------------- */
function getSegmentTicketStatus(segment, ctx) {
    const idStr = String(segment.id);
    const legacyKey = ctx.legacyKeyById[idStr];

    if (!legacyKey) return "Unknown";

    return ctx.ticketedSegments.has(legacyKey)
        ? "Ticketed"
        : "Not ticketed";
}

function formatTimestamp(ts) {
    if (!ts) return "";

    const d = new Date(ts);

    const year = d.getFullYear();
    const month = String(d.getMonth() + 1).padStart(2, "0");
    const day = String(d.getDate()).padStart(2, "0");

    const hours = String(d.getHours()).padStart(2, "0");
    const minutes = String(d.getMinutes()).padStart(2, "0");

    return `${year}-${month}-${day} ${hours}:${minutes}`;
}

function formatDuration(isoDuration) {
    if (!isoDuration || typeof isoDuration !== "string") return "";

    // Extract hours and minutes using regex
    const hoursMatch = isoDuration.match(/(\d+)H/);
    const minutesMatch = isoDuration.match(/(\d+)M/);

    const hours = hoursMatch ? Number(hoursMatch[1]) : 0;
    const minutes = minutesMatch ? Number(minutesMatch[1]) : 0;

    // Build output
    if (hours > 0 && minutes > 0) {
        return `${hours}h ${minutes}min`;
    }
    if (hours > 0) {
        return `${hours}h`;
    }
    return `${minutes}min`;
}

function formatServiceClass(serviceClass) {
    if (serviceClass === "C") {
        return `<span style="color:#855998;font-weight:bold;">${serviceClass}</span>`;
    } else if (serviceClass === "M") {
        return `<span style="color:#429364;font-weight:bold;">${serviceClass}</span>`;
    }
    else if (serviceClass === "W") {
        return `<span style="color:#5591ba;font-weight:bold;">${serviceClass}</span>`;
    }
    else if (serviceClass === "F") {
        return `<span style="color:#d65a4d;font-weight:bold;">${serviceClass}</span>`;
    }
    else{
        return serviceClass;
    }

    return serviceClass;
}

function calculateDuration(startDuration, endDuration) {
    const start = new Date(startDuration);
    const end = new Date(endDuration);

    let diffMs = end - start;
    const isNegative = diffMs < 0;

    // Work with absolute value for calculations
    diffMs = Math.abs(diffMs);

    const totalMinutes = Math.floor(diffMs / (1000 * 60));

    const days = Math.floor(totalMinutes / (60 * 24));
    const hours = Math.floor((totalMinutes % (60 * 24)) / 60);
    const minutes = totalMinutes % 60;

    const parts = [];

    if (days > 0) {
        parts.push(`${days}d`);
    }

    if (hours > 0 || days > 0) {
        parts.push(`${hours}h`);
    }

    parts.push(`${minutes}m`);

    let result = parts.join(" ");

    if (isNegative) {
        result = `<span style="color:red;font-weight:bold;">-${result} IMPOSSIBLE</span>`;
    }

    return result;
}

document.addEventListener("DOMContentLoaded", () => {
    document.getElementById("parseBtn").addEventListener("click", () => {
        const raw = document.getElementById("jsonInput").value.trim();
        if (!raw) return alert("Paste JSON first");

        let json;
        try { json = JSON.parse(raw); }
        catch { return alert("Invalid JSON"); }

        renderPretty(json);
        renderDev(json);
    });
});

function renderDev(json) {
    document.getElementById("devOutput").textContent =
        JSON.stringify(json, null, 2);
}

                        Aircraft: ${safe(seg, "aircraft.code")} - ${safe(seg, "aircraft.name")} <br>
                        Reservation status: ${reservationStatusName}<br>
                        Booking class: ${bookingClass}<br>
                        Fare class: ${fareClass}<br>
                        Service class: ${formatServiceClass(serviceClass)}<br>
                        Service class name: ${serviceClassName}<br>
                        FS number: ${fsNumber}<br>
                        Marketing carrier flight number: ${safe(seg, "marketingCarrier.code")}${safe(seg, "marketingCarrier.flightNumber")}<br>
                        Operating carrier flight number: ${safe(seg, "operatingCarrier.code")}${safe(seg, "operatingCarrier.flightNumber")}<br>
                        Operating carrier: <img src="${operatingAirlineLogoPath}" alt="" width="15" height="15">
                        ${safe(seg, "operatingCarrier.name")}
                         <br>
                        <br>
                        Status: ${formatFlightStatus(safe(seg, "status"))}<br>
                        <strong>Ticketing (segment): ${ticketStatus}</strong>
                    </div>
                    <br>

                    <strong>Seats:</strong><br>
                                    
                    ${
                        seats.length
                            ? seats.map(s => `
                                ${s.passengerName}: ${s.seat}
                            `).join("<br>")
                            : "No seat assignments"
                    }
                                    
                    <br><br>
                                    
                    <strong>Baggage:</strong><br>
                                    
                    ${
                        baggage.length
                            ? baggage.map(b => `
                                <h4>${b.passengerName}: </h4>
                                Base Allowance: ${b.baseAllowance} ${b.concept}
                                à ${b.maxValuePerUnit}${b.unitType} <br>
                                Tier Allowance: ${b.tierAllowance} ${b.concept}
                                à ${b.maxValuePerUnit}${b.unitType}<br>
                                Total: ${b.total} ${b.concept}
                                à ${b.maxValuePerUnit}${b.unitType}
                            `).join("<br>")
                            : "No baggage information"
                    }
                                    
                    <br><br>
                                    
                    <strong>FQTV / EuroBonus:</strong><br>
                                    
                    ${
                        fqtv.length
                            ? fqtv.map(f => `
                                ${f.passengerName}: 
                                ${f.number}
                                (${f.tierCode} - ${f.tierName})
                            `).join("<br>")
                            : "No FQTV information"
                    }


                    <br><br>

                    <strong>FQTR:</strong><br>

                    ${
                        fqtr.length
                            ? fqtr.map(f => `
                                ${f.passengerName}: 
                                ${f.number}
                                (${f.tier} - ${f.carrier})
                            `).join("<br>")
                            : "No FQTR information"
                    }
                    <hr>
                `;
            });

            html += `</div>`;
        });
    } else {
        html += `<div class="card"><h3>✈️ Flights</h3>No flight data</div>`;
    }



    
    /* -----------------------------
       SEATS (LEGACY seats if present)
    ----------------------------- */
    html += `<div class="card"><h3>💺 Seats</h3>`;
    let seatFound = false;

    if (data.LEGACY?.ancillaryProducts) {
        data.LEGACY.ancillaryProducts.forEach(anProd => {
        anProd.connections.forEach(conn => {
            conn.segments.forEach(seg => {
                seg.passengers?.forEach(pax =>

                {

                    const seat = pax.allowance?.number?? "N/A"
                    if (seat && (seat != "N/A")) {
                    seatFound = true;
                    html += `Segment ${seg.id}: Seat ${seat}<br>`;
                }
                }
                )
                //const seat = seg.seat || seg.seatNumber || seg.seatAssignment || seg.allowance.passengers.allowance.number;
                
            });
        });

    });
    }

    if (!seatFound) html += `No seat assignments available`;
    html += `</div>`;



        html += `<div class="card"><h3>Checkin Baggage Allowance</h3>`;
    let baggageFound = false;

    if (data.LEGACY?.ancillaryProducts) {
        data.LEGACY.ancillaryProducts.forEach(anProd => {
        anProd.connections.forEach(conn => {
            conn.segments.forEach(seg => {
                seg.passengers?.forEach(pax =>

                {
                    
                    const baggage = pax.allowance?.checkinBaggage?.total?? "N/A"
                    
                    const baggageConcept = pax.allowance?.checkinBaggage?.concept?? "N/A"
                    const baggageUnitType = pax.allowance?.checkinBaggage?.unitType?? "N/A"
                    const baggageMaxValuePerUnit = pax.allowance?.checkinBaggage?.maxValuePerUnit?? "N/A"
                    //console.log(`Pax: ${pax.id} Seg: ${seg.id}: Bag(s): ${baggage} ${baggageConcept} à ${baggageMaxValuePerUnit} ${baggageUnitType}`)
                    if (baggage!="N/A") {
                    baggageFound = true;
                    html += `Pax: ${pax.id} Seg: ${seg.id}: Bag(s): ${baggage} ${baggageConcept} à ${baggageMaxValuePerUnit} ${baggageUnitType}<br>`;
                }
                }
                )
                //const seat = seg.seat || seg.seatNumber || seg.seatAssignment || seg.allowance.passengers.allowance.number;
                
            });
        });

    });
    }

    if (!baggageFound) html += `No baggage info available`;
    html += `</div>`;



    
            /* -----------------------------
       Ticketing Info
    ----------------------------- */

    /*
    html += `<div class="card"><h3>Additional info</h3>`;
    (data.LEGACY.documentInformation || []).forEach(p => {
        html += `
            <div style="margin-bottom:10px;">
                <strong>Name:</strong> ${p}<br>
                
                
            </div>
        `;
    });
    html += `</div>`;

    */

    /* -----------------------------
       Rebook information
    ----------------------------- */

    html += `<div class="card"><h3>Rebook information</h3>`;
    (data.LEGACY.rebookInformation || []).forEach(r => {
        html += `
            <div style="margin-bottom:10px;">
                <strong>Code: </strong>${safe(r, "name")} (${safe(r, "name")})<br>
                <strong>Date: </strong>${safe(r, "rebookedDate")}<br>
                
            </div>
        `;
    });
    html += `</div>`;


    /* -----------------------------
       Notifications
    ----------------------------- */

        html += `<div class="card"><h3>Notifications</h3>`;
    (data.LEGACY.notifications || []).forEach(n => {
        html += `
            <div style="margin-bottom:10px;">
                <strong>Code: </strong>${safe(n, "code")}<br>
                <strong>Type: </strong>${safe(n, "type")}<br>
                <strong>Description: </strong>${safe(n, "description")}<br>
                
            </div>
        `;
    });
    html += `</div>`;
    /* -----------------------------
       Additional Info
    ----------------------------- */
            html += `<div class="card"><h3>Additional info</h3>`;
    (data.LEGACY.additionalInformation || []).forEach(info => {
        html += `
            <div style="margin-bottom:10px;">
                <strong>Name:</strong> ${safe(info, "name")}<br>
                <strong>Info:</strong> ${safe(info, "additionalInformation")}<br>
                
            </div>
        `;
    });
    html += `</div>`;

    document.getElementById("prettyOutput").innerHTML = html;
}
</script>

</body>
</html>
